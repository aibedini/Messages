<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Android SMS Gateway — API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    html { box-sizing: border-box; }
    body { margin: 0; background: #fafafa; }
    #banner {
      background: #1b1f24; color: #fff;
      padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #banner h1 { font-size: 16px; margin: 0; font-weight: 600; }
    #banner span.badge {
      background: #2ea44f; color: #fff; border-radius: 12px;
      font-size: 11px; padding: 2px 10px; letter-spacing: .4px;
    }
    #banner a { color: #79c0ff; font-size: 13px; text-decoration: none; }
    #swagger { padding: 0; }
  </style>
</head>
<body>
  <div id="banner">
    <h1>Android SMS Gateway &mdash; REST API</h1>
    <span class="badge">v1.2.1</span>
    <a href="./openapi.yaml">openapi.yaml</a>
    <a href="./README.md">README reference</a>
  </div>
  <div id="swagger"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "./openapi.yaml",
        dom_id: "#swagger",
        deepLinking: true,
        persistAuthorization: true,
        docExpansion: "list",
        filter: true,
        tryItOutEnabled: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });

      // Prefill the Authorize dialog so consumers only paste their gw_ key once.
      setTimeout(function () {
        var key = new URLSearchParams(location.search).get("key");
        if (key && window.ui) {
          window.ui.preauthorizeApiKey("ApiKeyAuth", key);
          window.ui.preauthorizeApiKey("BearerAuth", key);
        }
      }, 500);
    };
  </script>
</body>
</html>
