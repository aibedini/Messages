name: Setup Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Generate Keystore
      run: |
        keytool -genkey -v \
          -keystore release-key.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias sms-key \
          -storepass SmsCenter2026 \
          -keypass SmsCenter2026 \
          -dname "CN=SMS Center, OU=Dev, O=AIBedini, L=Tehran, ST=Tehran, C=IR"
        
    - name: Upload Keystore
      uses: actions/upload-artifact@v4
      with:
        name: release-keystore
        path: release-key.jks
        retention-days: 7
        
    - name: Print Keystore Info
      run: |
        echo "✅ Keystore generated successfully!"
        echo ""
        echo "📥 Download the keystore from the artifacts section above."
        echo ""
        echo "🔐 Keystore Credentials:"
        echo "  KEYSTORE_PASSWORD: SmsCenter2026"
        echo "  KEY_ALIAS: sms-key"
        echo "  KEY_PASSWORD: SmsCenter2026"
        echo ""
        echo "📝 Next Steps:"
        echo "1. Download release-key.jks from artifacts"
        echo "2. Convert to base64: base64 release-key.jks"
        echo "3. Add to GitHub Secrets:"
        echo "   - KEYSTORE_BASE64: (base64 output)"
        echo "   - KEYSTORE_PASSWORD: SmsCenter2026"
        echo "   - KEY_ALIAS: sms-key"
        echo "   - KEY_PASSWORD: SmsCenter2026"
