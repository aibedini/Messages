name: Final Realtime Gate

on:
  push:
    branches:
      - fix/realtime-room-ssot
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: final-realtime-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Final source gates
        run: |
          ./gradlew testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin lintDebug

      - name: Require Room v15 schema
        run: |
          test -f app/schemas/com.autonomousone.messages.data.MessagesDatabase/15.json
          git diff --check

      - name: Commit generated Room v15 schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/realtime-room-ssot'
        run: |
          if ! git diff --quiet -- app/schemas/com.autonomousone.messages.data.MessagesDatabase/15.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas/com.autonomousone.messages.data.MessagesDatabase/15.json
            git commit -m "chore(schema): export Room v15"
            git push origin HEAD:fix/realtime-room-ssot
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: realtime-room-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
