name: OpenWiki Update

on:
  workflow_dispatch:
  # NOTE: schedule intentionally removed — OpenWiki's source fingerprint hashes
  # file bytes, and the local Windows working tree (CRLF, core.autocrlf=true)
  # can never match a Linux runner checkout (LF). On GH runners every run looks
  # "source changed" and regenerates all pages (~6h, hits the timeout).
  # The daily refresh runs on the owner's machine via Hermes cron
  # (openwiki-daily.sh) against the real working tree instead.
  # WARNING: a manual dispatch here will regenerate ALL pages (~6h) because
  # the runner's LF checkout can never match the local CRLF fingerprint.
  # Keep this file as a documented starting point if line endings are ever
  # normalized (e.g. .gitattributes text=auto eol=lf + renormalize).

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom add high-fidelity validation of Mermaid diagrams.
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        # --update also handles the first run for code docs when env vars are set.
        run: openwiki code --update --print
        env:
          OPENWIKI_TELEMETRY_DISABLED: "1"
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENWIKI_MODEL_ID: qwen3.8-27b

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
