# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 4 GiB, not 2: the release build's lintVitalAnalyzeRelease on the full Compose/R8 classpath
# exhausted a 2 GiB heap ("Java heap space" in CheckDslScopeViolation) and failed every release
# tag from v3.6.0 on. Application builds and the debug gate do not need it, but the daemon is
# shared, so it is set globally.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Disable configuration cache to prevent stale AGP JdkImageTransform jlink path errors when IDE JDK paths change
org.gradle.configuration-cache=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.useAndroidX=true

# Specify system JDK path to prevent invalid IDE extension Java path references
# Commented out for CI compatibility - let Gradle use JAVA_HOME from environment
# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
