# Gitleaks configuration for Messages.
#
# Extends the upstream default rule set (`useDefault = true`). Allowlist
# entries are added below only for findings verified to be non-secret
# fixtures; each entry is scoped to one rule and a narrow path, never to a
# secret value.

title = "Messages secret scanning"

[extend]
useDefault = true

# Synthetic JWT assembled from literal test data in a redaction test; never a live credential.
[[allowlists]]
description = "Synthetic JWT built from literals in the sanitizer redaction test"
targetRules = ["jwt"]
paths = ['''app/src/test/java/com/autonomousone/messages/ExitReasonSanitizerTest\.kt$''']

# Dummy `token = ...` assignment used to test log redaction; not a credential.
[[allowlists]]
description = "Dummy token assignment used by the sanitizer redaction test"
targetRules = ["generic-api-key"]
paths = ['''app/src/test/java/com/autonomousone/messages/ExitReasonSanitizerTest\.kt$''']

# Synthetic JWT fixture used to prove JWTs are stripped from logs; not a credential.
[[allowlists]]
description = "Synthetic JWT fixture in the log redaction test"
targetRules = ["jwt"]
paths = ['''app/src/test/java/com/autonomousone/messages/LogRedactorTest\.kt$''']

# Sequential dummy device ID (abcdef1234567890) in a sanitizer test; not a credential.
[[allowlists]]
description = "Sequential dummy device ID in the diagnostics sanitizer test"
targetRules = ["generic-api-key"]
paths = ['''app/src/test/java/com/autonomousone/messages/sync/diagnostics/SyncDiagnosticsTest\.kt$''']
